<title>SpaBench hex sticker with threaded paths through method columns</title>
<desc>Cream hexagonal sticker with deep navy border. Four columns of dots represent method choices per pipeline step; three curved paths thread through highlighted selections to suggest example workflows through the combinatorial space. SpaBench wordmark in italic serif.</desc>

