# config.yaml

# Samples to process
samples:
  - Human_DLPFC_151507
# platform for sample: Visium, VisiumHD, Slideseq, Stereoseq
platform: Visium

# optional per-sample overrides
sample_platforms:
  Human_DLPFC_151676: Visium
  Human_BreAST_BlockASection1: VisiumHD
# optional non-standard raw filename (default 'filtered_feature_bc_matrix.h5')
raw_filename: filtered_feature_bc_matrix.h5

# Available normalization methods
normalizations:
  - LogNormalize
  - SCTransform
  - RC
  - CLR
  - SpaNorm

# Default parameters for LogNormalize
normalize:
  method: LogNormalize
  scale_factor: 10000

# Default parameters for SCTransform
sctransform:
  assay: Spatial

# Available feature‐selection methods
#feature_methods:
#  - vst             # Seurat FindVariableFeatures(selection.method="vst")
#  - markvariogram   # Seurat FindSpatiallyVariableFeatures(method="markvariogram")
#  - moransi         # Seurat FindSpatiallyVariableFeatures(method="moransi")
#  - nnSVG           # Seurat nnSVG
# Parameters for vst
#features:
#  n_features: 10000

features:
  methods:
    - vst
    - mvp               # Seurat - selection.method="mean.var.plot"
    - disp              # Seurat - selection.method="dispersion"
    - markvariogram
    - moransi
    - nnSVG
    - SPARK
    - SPARK-X
  n_features: 10000

# Available dimensionality‐reduction methods
# (we use PCA and UMAP in a combined script)
reduction_methods:
  - PCA
  - UMAP

# PCA parameters
pca:
  npcs: 30

# Available clustering algorithms
algorithms:
  louvain: 1
  louvain_refine: 2
  SLM: 3
  leiden: 4
  BANKSY: null   # SPECIAL: BANKSY will be handled by cluster_BANKSY rule
  BayesSpace: null    # special: handled by cluster_BayesSpace
  SpaGCN: null      # handled by cluster_SpaGCN
  SpatialPCA: null     
  SpatialLeiden: null
  stlearn: null

# Clustering parameters (Seurat & BANKSY)
clustering:
  resolution: 0.5   # generic resolution for Seurat clustering
  nrep: 1000        # BayesSpace MCMC repetitions
  burn_in: 100      # BayesSpace MCMC burn-in
  q: 10             # BayesSpace number of clusters
  lambda: 0.2       # 0:non-spatial clustering; 0.2:cell typing; 0.8:domain segmentation
  k_geom: 50        # Banksy-specific k_geom

# SpaGCN-specific parameters
SpaGCN:
  n_clusters: 10
  beta: 49
  alpha: 1
  refine: true
  histology: false

# stLearn–specific parameters
stlearn:
  # 当使用 Louvain 时构建邻接图的 neighbors 数目
  n_neighbors: 10
  n_pcs: 50
  resolution: 1.0
  use_morphology: false

# SpatialPCA–specific parameters
SpatialPCA:
  n_clusters: 10      # desired number of clusters
  refine: false       # if true, set fast=FALSE; if false, fast=TRUE

# SpatialLeiden-specific parameters
SpatialLeiden:
  n_neighbors: 10           # k for latent graph (same intent as stlearn n_neighbors)
  n_pcs: 30                 # number of PCs to compute / use
  resolution: 2.5           # default latent resolution
  layer_ratio: 1.8          # weighting between expression and spatial layers
  coord_type: "generic"     # passed to squidpy.gr.spatial_neighbors: "generic" or "grid"
  directed: false           # directed graph flag for
  refine: true              # if true, run resolution search to match n_clusters
  search_n_clusters: 15   # optional: if provided, tune resolution to produce this # clusters

# Visualization metrics summary
metrics_summary:
  plot_width: 16
  plot_height: 14
